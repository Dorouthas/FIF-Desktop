name: Tests and package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install package and test dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --extra web --extra dev --python ${{ matrix.python }}
      - name: Prepare FFmpeg
        shell: pwsh
        run: |
          uv run --no-sync fif-oral-env ffmpeg --data-dir data/ci
          $ffmpegDirectory = uv run --no-sync python -c "from pathlib import Path; from fif_oral.environment.manager import default_ffmpeg; print(Path(default_ffmpeg(Path('data/ci'))).parent)"
          $ffmpegDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Check JavaScript
        run: node --check src/fif_oral/web/static/app.js
      - name: Build wheel and source distribution
        run: uv run --no-sync python -m build
      - name: Check public source files
        run: uv run --no-sync python scripts/package_release.py --version 1.0.0-beta.1 --check-only
